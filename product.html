<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product — Voltra</title>
  <link rel="stylesheet" href="style.css?v=2" />
  <link rel="stylesheet" href="auth.css?v=2" />
  <link rel="stylesheet" href="style-product.css?v=2" />
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">⚡ Voltra</a>
      <nav class="nav">
        <a href="index.html" class="nav-link">Shop</a>
        <a href="auth.html" class="account-btn">
          <span id="accountLabel">👤 Login</span>
        </a>
        <a href="index.html#cart" class="cart-btn" id="cartLink">
          🛒 Cart
          <span class="cart-count" id="cartCountPdp">0</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="container product-main" id="productMain">
    <div class="pd-loading">Loading product…</div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div>
        <div class="logo">⚡ Voltra</div>
        <p>Honest electronics. Fair prices.<br />Since 2026.</p>
      </div>
      <div class="footer-cols">
        <a href="index.html">Shop</a>
        <a href="index.html#deals">Deals</a>
        <a href="#">Returns</a>
        <a href="#">Support</a>
      </div>
    </div>
    <p class="copyright">© 2026 Voltra Electronics. A demo store — no real orders are placed.</p>
  </footer>

  <div class="toast" id="toast"></div>

  <script src="catalog.js?v=2"></script>
  <script src="product.js?v=2"></script>
  <script>
    // Compact the header when both account + cart icons exist on small screens
    window.addEventListener("resize", () => document.body.classList.toggle("compact-header", window.innerWidth < 640));
  </script>
</body>
</html>
